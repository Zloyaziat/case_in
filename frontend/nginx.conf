server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API бэкенда: имя сервиса в compose-сети (backend), порт 8000.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Swagger/OpenAPI бэкенда — удобно открыть документацию с того же порта.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA: любой путь отдаём index.html, клиентский роутер разберётся.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика с кэшем, index.html — без (чтобы обновление подхватывалось сразу)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
